name: Layout MaxSAT experimental wheels
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'nya-a-cat/tilelang'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      USE_CUDA: 'ON'
      USE_ROCM: 'OFF'
      USE_LLVM: 'OFF'
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install binary build dependencies
        run: |
          python -m pip install --only-binary=:all: 'scikit-build-core<1' 'cython>=3.1' cmake ninja patchelf 'apache-tvm-ffi>=0.1.11,<0.1.13' 'z3-solver>=4.13,<4.15.5' 'nvidia-cuda-nvcc==13.0.88' 'nvidia-cuda-cccl==13.0.85' 'nvidia-nvvm==13.0.88' 'nvidia-cuda-crt==13.0.88' 'nvidia-cuda-runtime==13.0.88' pytest
          python -m pip freeze > build-environment.txt
          # Recreate links/stubs outside the restored build directory.
          python cmake/find_pip_cuda.py
      - name: Validate solver
        run: python -m pytest --confcutdir=testing/python/layout testing/python/layout/test_tilelang_layout_solver.py -q
      - uses: actions/cache/restore@v4
        with:
          path: build
          key: layout-maxsat-build-cuda130-v1-${{ github.sha }}
          restore-keys: layout-maxsat-build-cuda130-v1-
      - name: Record exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          baseline=1a1df62e94d9736a2c9f13849bc4c2cf9377275b
          mkdir -p wheel-results/baseline wheel-results/candidate
          cp build-environment.txt wheel-results/
          printf 'baseline=%s\ncandidate=%s\n' "$baseline" "$candidate" > wheel-results/source-revisions.txt
          git submodule status --recursive >> wheel-results/source-revisions.txt
      - name: Build upstream baseline
        run: |
          set -euo pipefail
          baseline=1a1df62e94d9736a2c9f13849bc4c2cf9377275b
          git checkout --detach "$baseline"
          python -m pip wheel . --no-deps --no-build-isolation -v -w wheel-results/baseline
      - name: Build experimental candidate
        run: |
          set -euo pipefail
          git checkout --detach "$GITHUB_SHA"
          python -m pip wheel . --no-deps --no-build-isolation -v -w wheel-results/candidate
          find wheel-results -name '*.whl' -exec sha256sum {} + > wheel-results/SHA256SUMS
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build
          key: layout-maxsat-build-cuda130-v1-${{ github.sha }}
      - name: Publish fork experimental wheels for remote Colab download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="layout-maxsat-${GITHUB_SHA:0:12}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Layout MaxSAT experimental wheels ${GITHUB_SHA:0:8}" --notes-file wheel-results/source-revisions.txt wheel-results/baseline/*.whl wheel-results/candidate/*.whl wheel-results/SHA256SUMS wheel-results/build-environment.txt wheel-results/source-revisions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-maxsat-wheels
          path: wheel-results
          retention-days: 14
