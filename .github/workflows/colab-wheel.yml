name: Build Colab wheel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit or ref to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: colab-wheel-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build-colab-wheel:
    name: Linux x86_64 CUDA 13 wheel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CIBW_BUILD: cp310-manylinux_x86_64
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CUDA_VERSION: "13.0"
      NO_VERSION_LABEL: "OFF"
    steps:
      - name: Checkout exact source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Record source revisions
        id: source
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${commit}"
            git submodule status --recursive
          } | tee source-revisions.txt

      - name: Build and import-test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - name: Record checksums
        shell: bash
        run: |
          sha256sum wheelhouse/*.whl | tee wheelhouse/SHA256SUMS
          cp source-revisions.txt wheelhouse/source-revisions.txt
          ls -lh wheelhouse

      - name: Upload Colab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tilelang-colab-linux-x86_64-${{ steps.source.outputs.commit }}
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 7