name: Build Colab wheel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit or ref to build
        required: true
        type: string
      build_mode:
        description: Fast CUDA compile artifact or fully tested CUDA+ROCm prerelease wheel
        required: true
        default: fast-cuda
        type: choice
        options:
          - fast-cuda
          - release-fat

permissions:
  contents: read

concurrency:
  group: colab-wheel-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build-colab-wheel:
    name: Linux x86_64 CUDA 13 wheel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CIBW_BUILD: cp310-manylinux_x86_64
      CUDA_VERSION: "13.0"
      NO_VERSION_LABEL: "OFF"
      TILELANG_COLAB_BUILD_MODE: ${{ inputs.build_mode }}
    steps:
      - name: Checkout exact source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Record source revisions
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          native_fingerprint="$({
            git ls-tree -r HEAD -- \
              CMakeLists.txt \
              cmake \
              pyproject.toml \
              src \
              tilelang/jit/adapter/cython/cython_wrapper.pyx
            git submodule status --recursive
          } | sha256sum | awk '{ print $1 }')"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "native_fingerprint=${native_fingerprint}" >> "${GITHUB_OUTPUT}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${commit}"
            echo "build_mode=${TILELANG_COLAB_BUILD_MODE}"
            echo "native_fingerprint=${native_fingerprint}"
            if [[ "${TILELANG_COLAB_BUILD_MODE}" == "fast-cuda" ]]; then
              echo "backends=CUDA"
              echo "test_policy=compile_only"
            else
              echo "backends=CUDA,ROCm"
              echo "test_policy=cibuildwheel_import"
            fi
            git submodule status --recursive
          } | tee source-revisions.txt

      - name: Restore native compiler cache
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: colab-wheel-ccache-v1-${{ runner.os }}-${{ runner.arch }}-cuda130-${{ steps.source.outputs.native_fingerprint }}
          restore-keys: |
            colab-wheel-ccache-v1-${{ runner.os }}-${{ runner.arch }}-cuda130-

      - name: Configure cached parallel build
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(getconf _NPROCESSORS_ONLN)"
          host_ccache_dir="${GITHUB_WORKSPACE}/.cache/ccache"
          mkdir -p "${host_ccache_dir}"

          {
            echo "CCACHE_DIR=${host_ccache_dir}"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=${jobs}"
            echo "CMAKE_GENERATOR=Ninja"
            echo "CIBW_BEFORE_ALL_LINUX=set -eux; dnf config-manager --add-repo https://developer.download.nvidia.cn/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo; dnf install -y cuda-minimal-build-13-0 cuda-driver-devel-13-0 cuda-nvrtc-devel-13-0 ccache ninja-build; dnf clean all"
          } >> "${GITHUB_ENV}"

          if [[ "${TILELANG_COLAB_BUILD_MODE}" == "fast-cuda" ]]; then
            {
              echo "CIBW_ENVIRONMENT_LINUX=PYTHONDEVMODE=1 PYTHONUNBUFFERED=1 PATH=/usr/local/cuda/bin:\$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs:\$LD_LIBRARY_PATH USE_CUDA=ON USE_ROCM=OFF CMAKE_GENERATOR=Ninja CMAKE_BUILD_PARALLEL_LEVEL=${jobs} CCACHE_DIR=/host${host_ccache_dir} CCACHE_MAXSIZE=2G CCACHE_BASEDIR=/project CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content"
              echo "CIBW_TEST_SKIP=*"
            } >> "${GITHUB_ENV}"
          else
            echo "CIBW_ENVIRONMENT_LINUX=PYTHONDEVMODE=1 PYTHONUNBUFFERED=1 PATH=/usr/local/cuda/bin:\$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs:\$LD_LIBRARY_PATH USE_CUDA=ON USE_ROCM=ON CMAKE_GENERATOR=Ninja CMAKE_BUILD_PARALLEL_LEVEL=${jobs} CCACHE_DIR=/host${host_ccache_dir} CCACHE_MAXSIZE=2G CCACHE_BASEDIR=/project CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          fi

          echo "Using ${jobs} build workers; cache hit=${{ steps.native-cache.outputs.cache-hit }}; mode=${TILELANG_COLAB_BUILD_MODE}"

      - name: Build and import-test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - name: Record compiler cache statistics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            ccache -s | tee ccache-stats.txt
          else
            echo "Host ccache executable unavailable; cache files remain under ${CCACHE_DIR}." | tee ccache-stats.txt
          fi
          du -sh .cache/ccache build 2>/dev/null | tee build-storage.txt || true

      - name: Record checksums
        shell: bash
        run: |
          sha256sum wheelhouse/*.whl | tee wheelhouse/SHA256SUMS
          cp source-revisions.txt wheelhouse/source-revisions.txt
          cp ccache-stats.txt wheelhouse/ccache-stats.txt
          cp build-storage.txt wheelhouse/build-storage.txt
          ls -lh wheelhouse

      - name: Upload Colab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tilelang-colab-linux-x86_64-${{ steps.source.outputs.commit }}-${{ inputs.build_mode }}
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 7
