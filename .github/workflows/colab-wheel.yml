name: Build Colab wheel

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit or ref to build
        required: true
        type: string
      build_mode:
        description: Fast CUDA compile artifact or fully tested CUDA+ROCm prerelease wheel
        required: true
        default: fast-cuda
        type: choice
        options:
          - fast-cuda
          - release-fat

permissions:
  contents: read

concurrency:
  group: colab-wheel-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  build-colab-wheel:
    name: Linux x86_64 CUDA 13 wheel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CIBW_BUILD: cp310-manylinux_x86_64
      CUDA_VERSION: "13.0"
      NO_VERSION_LABEL: "OFF"
      TILELANG_COLAB_BUILD_MODE: ${{ inputs.build_mode }}
      MANYLINUX_IMAGE_DIGEST: 012f4a50472412f18bb2b450c1cce7158434cfae4ae878591c2748a13a30c2be
    steps:
      - name: Start pinned manylinux image pull
        shell: bash
        run: |
          set -euo pipefail
          image="quay.io/pypa/manylinux_2_28_x86_64@sha256:${MANYLINUX_IMAGE_DIGEST}"
          pull_log="${RUNNER_TEMP}/tilelang-manylinux-pull.log"
          pull_pid="${RUNNER_TEMP}/tilelang-manylinux-pull.pid"
          : > "${pull_log}"
          nohup docker pull "${image}" > "${pull_log}" 2>&1 &
          echo "$!" > "${pull_pid}"
          echo "Started pinned image pull in process $(cat "${pull_pid}") while source and build caches restore."

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Resolve exact native dependency revisions
        id: native-deps
        shell: bash
        run: |
          set -euo pipefail
          cutlass_sha="$(git ls-tree HEAD 3rdparty/cutlass | awk '{ print $3 }')"
          tvm_sha="$(git ls-tree HEAD 3rdparty/tvm | awk '{ print $3 }')"
          [[ "${cutlass_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${tvm_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "cutlass_sha=${cutlass_sha}" >> "${GITHUB_OUTPUT}"
          echo "tvm_sha=${tvm_sha}" >> "${GITHUB_OUTPUT}"

      - name: Restore exact native dependency trees
        id: native-deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .git/modules/3rdparty
            3rdparty/cutlass
            3rdparty/tvm
          key: tilelang-native-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-deps.outputs.cutlass_sha }}-${{ steps.native-deps.outputs.tvm_sha }}-${{ hashFiles('.gitmodules') }}

      - name: Initialize and verify exact native dependency trees
        shell: bash
        env:
          CUTLASS_SHA: ${{ steps.native-deps.outputs.cutlass_sha }}
          TVM_SHA: ${{ steps.native-deps.outputs.tvm_sha }}
        run: |
          set -euo pipefail
          git submodule sync --recursive
          if [[ "${{ steps.native-deps-cache.outputs.cache-hit }}" != "true" ]]; then
            git submodule update --init --recursive --depth 1 --jobs "$(getconf _NPROCESSORS_ONLN)"
          else
            git submodule update --init --recursive --no-fetch
          fi

          test "$(git -C 3rdparty/cutlass rev-parse HEAD)" = "${CUTLASS_SHA}"
          test "$(git -C 3rdparty/tvm rev-parse HEAD)" = "${TVM_SHA}"
          git submodule status --recursive | tee submodule-revisions.txt
          if grep -Eq '^[-+U]' submodule-revisions.txt; then
            echo "Native dependency cache is incomplete or does not match the pinned revisions." >&2
            exit 2
          fi

      - name: Save verified native dependency trees
        if: steps.native-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .git/modules/3rdparty
            3rdparty/cutlass
            3rdparty/tvm
          key: tilelang-native-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-deps.outputs.cutlass_sha }}-${{ steps.native-deps.outputs.tvm_sha }}-${{ hashFiles('.gitmodules') }}

      - name: Record source revisions
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          native_fingerprint="$({
            git ls-tree -r HEAD -- \
              CMakeLists.txt \
              cmake \
              pyproject.toml \
              src \
              3rdparty/hip-headers \
              tilelang/jit/adapter/cython/cython_wrapper.pyx
            cat submodule-revisions.txt
          } | sha256sum | awk '{ print $1 }')"
          tvm_sdk_fingerprint="$({
            git ls-tree -r HEAD -- \
              CMakeLists.txt \
              cmake \
              pyproject.toml \
              src/cpu/CMakeLists.txt \
              src/cuda/CMakeLists.txt \
              src/metal/CMakeLists.txt \
              src/rocm/CMakeLists.txt \
              src/webgpu/CMakeLists.txt \
              src/runtime/logging.cc \
              maint/scripts/install_cached_cuda_toolchain.sh \
              maint/scripts/capture_prebuilt_tvm_sdk.sh
            git ls-tree HEAD 3rdparty/tvm
            echo "manylinux=${MANYLINUX_IMAGE_DIGEST}"
            echo "cuda=${CUDA_VERSION}"
            echo "backends=CUDA"
          } | sha256sum | awk '{ print $1 }')"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "native_fingerprint=${native_fingerprint}" >> "${GITHUB_OUTPUT}"
          echo "tvm_sdk_fingerprint=${tvm_sdk_fingerprint}" >> "${GITHUB_OUTPUT}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${commit}"
            echo "build_mode=${TILELANG_COLAB_BUILD_MODE}"
            echo "native_fingerprint=${native_fingerprint}"
            echo "tvm_sdk_fingerprint=${tvm_sdk_fingerprint}"
            echo "manylinux_image=quay.io/pypa/manylinux_2_28_x86_64@sha256:${MANYLINUX_IMAGE_DIGEST}"
            if [[ "${TILELANG_COLAB_BUILD_MODE}" == "fast-cuda" ]]; then
              echo "backends=CUDA"
              echo "test_policy=compile_only_unrepaired_wheel"
            else
              echo "backends=CUDA,ROCm"
              echo "test_policy=cibuildwheel_import"
            fi
            cat submodule-revisions.txt
          } | tee source-revisions.txt

      - name: Restore pinned CUDA toolchain package cache
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-toolchain
          key: colab-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-manylinux-${{ env.MANYLINUX_IMAGE_DIGEST }}-${{ hashFiles('maint/scripts/install_cached_cuda_toolchain.sh') }}

      - name: Restore native compiler cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: colab-wheel-ccache-v1-${{ runner.os }}-${{ runner.arch }}-cuda130-${{ steps.source.outputs.native_fingerprint }}
          restore-keys: |
            colab-wheel-ccache-v1-${{ runner.os }}-${{ runner.arch }}-cuda130-

      - name: Restore exact prebuilt TVM SDK
        id: tvm-sdk-cache
        if: inputs.build_mode == 'fast-cuda'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/prebuilt-tvm
          key: colab-wheel-tvm-sdk-v1-${{ runner.os }}-${{ runner.arch }}-cp310-manylinux-${{ env.MANYLINUX_IMAGE_DIGEST }}-cuda130-${{ steps.source.outputs.tvm_sdk_fingerprint }}

      - name: Validate exact prebuilt TVM SDK
        if: inputs.build_mode == 'fast-cuda' && steps.tvm-sdk-cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          TVM_SDK_FINGERPRINT: ${{ steps.source.outputs.tvm_sdk_fingerprint }}
        run: |
          set -euo pipefail
          expected="tvm_sdk_fingerprint=${TVM_SDK_FINGERPRINT}"
          actual="$(cat .cache/prebuilt-tvm/.tilelang-ci-cache-identity)"
          test "${actual}" = "${expected}"
          (
            cd .cache/prebuilt-tvm
            sha256sum --check SHA256SUMS
          )
          cat .cache/prebuilt-tvm/tvm-sdk-provenance.txt

      - name: Configure cached parallel build
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(getconf _NPROCESSORS_ONLN)"
          host_ccache_dir="${GITHUB_WORKSPACE}/.cache/ccache"
          host_toolchain_dir="${GITHUB_WORKSPACE}/.cache/ci-toolchain"
          host_tvm_sdk_dir="${GITHUB_WORKSPACE}/.cache/prebuilt-tvm"
          container_toolchain_dir="/host${host_toolchain_dir}"
          container_tvm_sdk_dir="/host${host_tvm_sdk_dir}"
          toolchain_cache_hit="${{ steps.toolchain-cache.outputs.cache-hit }}"
          toolchain_cache_hit="${toolchain_cache_hit:-false}"
          tvm_sdk_cache_hit="${{ steps.tvm-sdk-cache.outputs.cache-hit }}"
          tvm_sdk_cache_hit="${tvm_sdk_cache_hit:-false}"
          prebuilt_tvm_dir=""
          if [[ "${tvm_sdk_cache_hit}" == "true" ]]; then
            prebuilt_tvm_dir="${container_tvm_sdk_dir}"
          fi
          mkdir -p "${host_ccache_dir}" "${host_toolchain_dir}" "${host_tvm_sdk_dir}"

          {
            echo "CCACHE_DIR=${host_ccache_dir}"
            echo "CMAKE_BUILD_PARALLEL_LEVEL=${jobs}"
            echo "CMAKE_GENERATOR=Ninja"
            echo "CIBW_MANYLINUX_X86_64_IMAGE=quay.io/pypa/manylinux_2_28_x86_64@sha256:${MANYLINUX_IMAGE_DIGEST}"
            echo "CIBW_BEFORE_ALL_LINUX=/project/maint/scripts/install_cached_cuda_toolchain.sh ${container_toolchain_dir} ${toolchain_cache_hit}"
            echo "CIBW_BUILD_FRONTEND=build[uv]"
          } >> "${GITHUB_ENV}"

          if [[ "${TILELANG_COLAB_BUILD_MODE}" == "fast-cuda" ]]; then
            {
              echo "CIBW_ENVIRONMENT_LINUX=PYTHONDEVMODE=1 PYTHONUNBUFFERED=1 PATH=${container_toolchain_dir}/bin:/usr/local/cuda/bin:\$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs:\$LD_LIBRARY_PATH USE_CUDA=ON USE_ROCM=OFF CMAKE_GENERATOR=Ninja CMAKE_BUILD_PARALLEL_LEVEL=${jobs} CCACHE_DIR=/host${host_ccache_dir} CCACHE_MAXSIZE=2G CCACHE_BASEDIR=/project CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content TILELANG_PREBUILT_TVM_LIB_DIR=${prebuilt_tvm_dir}"
              echo "CIBW_TEST_SKIP=*"
              echo "CIBW_REPAIR_WHEEL_COMMAND_LINUX=ccache --show-stats | tee /host${GITHUB_WORKSPACE}/ccache-stats.txt && /project/maint/scripts/capture_prebuilt_tvm_sdk.sh ${container_tvm_sdk_dir} ${{ steps.source.outputs.tvm_sdk_fingerprint }} {wheel} && cp {wheel} {dest_dir}"
              echo "CIBW_AUDIT_COMMAND="
              echo "CIBW_AUDIT_REQUIRES="
            } >> "${GITHUB_ENV}"
          else
            {
              echo "CIBW_ENVIRONMENT_LINUX=PYTHONDEVMODE=1 PYTHONUNBUFFERED=1 PATH=${container_toolchain_dir}/bin:/usr/local/cuda/bin:\$PATH LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs:\$LD_LIBRARY_PATH USE_CUDA=ON USE_ROCM=ON CMAKE_GENERATOR=Ninja CMAKE_BUILD_PARALLEL_LEVEL=${jobs} CCACHE_DIR=/host${host_ccache_dir} CCACHE_MAXSIZE=2G CCACHE_BASEDIR=/project CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content"
              echo "CIBW_REPAIR_WHEEL_COMMAND_LINUX=ccache --show-stats | tee /host${GITHUB_WORKSPACE}/ccache-stats.txt && auditwheel -v repair --exclude libtvm_ffi.so --exclude 'libz3.so*' --exclude libcuda.so.1 --exclude '/usr/local/cuda*' -w {dest_dir} {wheel}"
            } >> "${GITHUB_ENV}"
          fi

          echo "Using ${jobs} build workers; toolchain cache hit=${toolchain_cache_hit}; compiler cache hit=${{ steps.native-cache.outputs.cache-hit }}; TVM SDK cache hit=${tvm_sdk_cache_hit}; mode=${TILELANG_COLAB_BUILD_MODE}"

      - name: Confirm pinned manylinux image is ready
        shell: bash
        run: |
          set -euo pipefail
          image="quay.io/pypa/manylinux_2_28_x86_64@sha256:${MANYLINUX_IMAGE_DIGEST}"
          pull_log="${RUNNER_TEMP}/tilelang-manylinux-pull.log"
          pull_pid_file="${RUNNER_TEMP}/tilelang-manylinux-pull.pid"
          pull_pid="$(cat "${pull_pid_file}")"
          deadline=$((SECONDS + 300))

          while kill -0 "${pull_pid}" 2>/dev/null; do
            if (( SECONDS >= deadline )); then
              kill "${pull_pid}" 2>/dev/null || true
              cat "${pull_log}" >&2
              echo "Timed out while pulling the pinned manylinux image." >&2
              exit 2
            fi
            sleep 1
          done

          if ! docker image inspect "${image}" >/dev/null 2>&1; then
            cat "${pull_log}" >&2
            echo "Pinned manylinux image pull failed." >&2
            exit 2
          fi
          cat "${pull_log}"
          docker image inspect "${image}" --format 'ready={{.Id}} platform={{.Os}}/{{.Architecture}}'

      - name: Build and import-test wheel
        id: wheel-build
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2
        with:
          extras: uv
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - name: Record compiler cache statistics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s ccache-stats.txt ]]; then
            cat ccache-stats.txt
          elif command -v ccache >/dev/null 2>&1; then
            ccache --show-stats | tee ccache-stats.txt
          else
            echo "Host ccache executable unavailable; cache files remain under ${CCACHE_DIR}." | tee ccache-stats.txt
          fi
          du -sh .cache/ccache .cache/ci-toolchain .cache/prebuilt-tvm 2>/dev/null | tee build-storage.txt || true

      - name: Save pinned CUDA toolchain package cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true' && steps.wheel-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ci-toolchain
          key: colab-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-manylinux-${{ env.MANYLINUX_IMAGE_DIGEST }}-${{ hashFiles('maint/scripts/install_cached_cuda_toolchain.sh') }}

      - name: Save native compiler cache
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.wheel-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: colab-wheel-ccache-v1-${{ runner.os }}-${{ runner.arch }}-cuda130-${{ steps.source.outputs.native_fingerprint }}

      - name: Save exact prebuilt TVM SDK
        if: inputs.build_mode == 'fast-cuda' && steps.tvm-sdk-cache.outputs.cache-hit != 'true' && steps.wheel-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/prebuilt-tvm
          key: colab-wheel-tvm-sdk-v1-${{ runner.os }}-${{ runner.arch }}-cp310-manylinux-${{ env.MANYLINUX_IMAGE_DIGEST }}-cuda130-${{ steps.source.outputs.tvm_sdk_fingerprint }}

      - name: Record checksums
        shell: bash
        run: |
          sha256sum wheelhouse/*.whl | tee wheelhouse/SHA256SUMS
          cp source-revisions.txt wheelhouse/source-revisions.txt
          cp ccache-stats.txt wheelhouse/ccache-stats.txt
          cp build-storage.txt wheelhouse/build-storage.txt
          cp .cache/ci-toolchain/toolchain-provenance.txt wheelhouse/toolchain-provenance.txt
          if [[ -s .cache/prebuilt-tvm/tvm-sdk-provenance.txt ]]; then
            cp .cache/prebuilt-tvm/tvm-sdk-provenance.txt wheelhouse/tvm-sdk-provenance.txt
          fi
          ls -lh wheelhouse

      - name: Upload Colab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tilelang-colab-linux-x86_64-${{ steps.source.outputs.commit }}-${{ inputs.build_mode }}
          path: wheelhouse/*
          if-no-files-found: error
          retention-days: 7
